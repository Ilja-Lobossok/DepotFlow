xt><path d="M980.0 124 V812" stroke="#527189" stroke-dasharray="5 4"/><path d="M80.0 160 H305.0" stroke="#efab58" stroke-width="2" stroke-dasharray="0" marker-end="url(#arr)"/><text x="192.5" y="151" fill="#dce8f4" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">1. handover + If-Match</text><path d="M305.0 222 H755.0" stroke="#efab58" stroke-width="2" stroke-dasharray="0" marker-end="url(#arr)"/><text x="530.0" y="213" fill="#dce8f4" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2. physical eligibility / allocation check</text><path d="M305.0 284 H530.0" stroke="#efab58" stroke-width="2" stroke-dasharray="0" marker-end="url(#arr)"/><text x="417.5" y="275" fill="#dce8f4" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3. claim atomically vs cancel</text><path d="M530.0 346 H305.0" stroke="#efab58" stroke-width="2" stroke-dasharray="0" marker-end="url(#arr)"/><text x="417.5" y="337" fill="#dce8f4" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">4. claim_id; cancellation fenced</text><path d="M305.0 408 H530.0" stroke="#68cbd4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="417.5" y="399" fill="#dce8f4" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">5. handed-over fact (also Inventory)</text><path d="M80.0 470 H305.0" stroke="#efab58" stroke-width="2" stroke-dasharray="0" marker-end="url(#arr)"/><text x="192.5" y="461" fill="#dce8f4" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">6. return inspection</text><path d="M305.0 532 H755.0" stroke="#68cbd4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="530.0" y="523" fill="#dce8f4" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">7. returned fact / release or quarantine</text><path d="M305.0 594 H530.0" stroke="#68cbd4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar