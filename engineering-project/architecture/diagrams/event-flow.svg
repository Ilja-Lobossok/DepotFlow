<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" role="img" aria-label="Event flow — durable business effect"><title>Event flow — durable business effect</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#68cbd4"/></marker></defs><rect width="1240" height="640" fill="#101d2c"/><text x="32" y="38" fill="#dce8f4" font-size="22" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Event flow — durable business effect</text><text x="32" y="64" fill="#92a9bd" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">DepotFlow • Design specification • стрелки = разрешённые потоки, не измеренная нагрузка</text><path d="M265.0,193.0 L350.0,193.0" fill="none" stroke="#68cbd4" stroke-width="2" marker-end="url(#arr)"/><rect x="293.9" y="179.0" width="39.2" height="22" rx="4" fill="#101d2c"/><text x="312.5" y="194.0" fill="#dce8f4" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">poll</text><path d="M580.0,193.0 L680.0,193.0" fill="none" stroke="#68cbd4" stroke-width="2" marker-end="url(#arr)"/><rect x="606.2" y="179.0" width="59.6" height="22" rx="4" fill="#101d2c"/><text x="635.0" y="194.0" fill="#dce8f4" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">confirm</text><path d="M795.0,236.0 L795.0,380.0" fill="none" stroke="#68cbd4" stroke-width="2" marker-end="url(#arr)"/><rect x="771.2" y="294.0" width="59.6" height="22" rx="4" fill="#101d2c"/><text x="800.0" y="309.0" fill="#dce8f4" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">deliver</text><path d="M680.0,423.0 L580.0,423.0" fill="none" stroke="#68cbd4" stroke-width="2" marker-end="url(#arr)"/><rect x="579.0" y="409.0" width="114.0" height="22" rx="4" fill="#101d2c"/><text x="635.0" y="424.0" fill="#dce8f4" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">commit then ACK</text><path d="M680.0,423.0 L26