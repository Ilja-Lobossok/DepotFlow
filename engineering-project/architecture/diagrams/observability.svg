po</text><text x="886" y="180" fill="#a8bdce" font-size="11" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Causal spans/exemplars</text></g><g data-service=""><rect x="40" y="380" width="290" height="90" rx="12" fill="#20364a" stroke="#527189" stroke-width="1.5"/><text x="56" y="409" fill="#dce8f4" font-size="16" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Prometheus</text><text x="56" y="430" fill="#a8bdce" font-size="11" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Histograms; low-cardinality labels</text></g><g data-service=""><rect x="415" y="380" width="310" height="90" rx="12" fill="#20364a" stroke="#527189" stroke-width="1.5"/><text x="431" y="409" fill="#dce8f4" font-size="16" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Loki</text><text x="431" y="430" fill="#a8bdce" font-size="11" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">JSON logs; no JWT/email</text></g><g data-service=""><rect x="870" y="380" width="280" height="90" rx="12" fill="#20364a" stroke="#527189" stroke-width="1.5"/><text x="886" y="409" fill="#dce8f4" font-size="16" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Grafana / alerts</text><text x="886" y="430" fill="#a8bdce" font-size="11" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SLO / queue age / saga pending</text></g></svg>
