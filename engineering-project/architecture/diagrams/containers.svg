<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2040 1060" role="img" aria-label="Container diagram — seven owned business boundaries"><title>Container diagram — seven owned business boundaries</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#68cbd4"/></marker></defs><rect width="2040" height="1060" fill="#101d2c"/><text x="32" y="38" fill="#dce8f4" font-size="22" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Container diagram — seven owned business boundaries</text><text x="32" y="64" fill="#92a9bd" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">DepotFlow • Design specification • стрелки = разрешённые потоки, не измеренная нагрузка</text><g data-service=""><rect x="40" y="110" width="280" height="90" rx="12" fill="#20364a" stroke="#527189"/><text x="55" y="141" fill="#dce8f4" font-size="17" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">React / TypeScript</text><text x="55" y="165" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Browser; role-based UI</text></g><g data-service=""><rect x="390" y="110" width="280" height="90" rx="12" fill="#20364a" stroke="#527189"/><text x="405" y="141" fill="#dce8f4" font-size="17" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Gateway / Nginx</text><text x="405" y="165" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">TLS • routing • rate limits</text></g><g data-service=""><rect x="740" y="110" width="280" height="90" rx="12" fill="#20364a" stroke="#527189"/><text x="755" y="141" fill="#dce8f4" font-size="17" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Keycloak</text><text x="755" y="165" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">OIDC • PKCE • JWKS</text></g><g data-service=""><rect x="1090" y="110" width="350" height="90" rx="12" fill=