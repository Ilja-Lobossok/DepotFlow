 UI,Arial,sans-serif">Own image • own API</text><text x="1735" y="412" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Node / TypeScript</text></g><path d="M1835 430 V490" stroke="#efab58" marker-end="url(#arr)"/><text x="1840" y="465" fill="#efab58" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">owner SQL</text><g data-service=""><rect x="1720" y="490" width="230" height="90" rx="12" fill="#20364a" stroke="#527189"/><text x="1735" y="521" fill="#dce8f4" font-size="17" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Notification DB</text><text x="1735" y="545" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Private PostgreSQL</text><text x="1735" y="562" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Own app/migration role</text></g><path d="M1950 394 H1970 V650" stroke="#68cbd4" fill="none" stroke-dasharray="6 4"/><path d="M40 650 H1970" stroke="#68cbd4" stroke-width="2"/><text x="45" y="628" fill="#68cbd4" font-size="15" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">AMQP event/command bus — durable outbox/inbox, at-least-once, explicit per-owner contracts</text><path d="M220 650 V730" stroke="#68cbd4" marker-end="url(#arr)"/><g data-service=""><rect x="40" y="730" width="410" height="100" rx="12" fill="#20364a" stroke="#527189"/><text x="55" y="761" fill="#dce8f4" font-size="17" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">RabbitMQ</text><text x="55" y="785" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">commands + facts + DLQ</text><text x="55" y="802" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">1node dev / 3node quorum lab</text></g><g data-service=""><rect x="540" y="730" width="410" height="100" rx="12" fill="#20364a" stroke="#527189"/><text x="555" y="761" fill="#dce8f4" font-size="17" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Redis</text><text x="555" y="785" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Catalog list cache + gateway throttle</text><text x="555" y="802" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Not an allocation or auth authority</text></g><g data-service=""><rect x="1040" y="730" width="410" height="100" rx="12" fill="#20364a" stroke="#527189"/><text x="1055" y="761" fill="#dce8f4" font-size="17" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Owned backup / restore</text><text x="1055" y="785" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Snapshot manifest + reconciliation</text><text x="1055" y="802" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Independent isolated restore target</text></g><g data-service=""><rect x="1540" y="730" width="420" height="100" rx="12" fill="#20364a" stroke="#527189"/><text x="1555" y="761" fill="#dce8f4" font-size="17" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Independent deployment</text><text x="1555" y="785" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">7images • 7migrations • contract gates</text><text x="1555" y="802" fill="#a8bdce" font-size="12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Compose → production-like K8s</text></g><text x="40" y="900" fill="#dce8f4" font-size="17" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Dashed AMQP lines are logical message routes. SQL arrows terminate only in the owner database.</text><text x="40" y="935" fill="#dce8f4" font-size="17" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">HTTP Tenancy checks, Fulfillment claim/eligibility and Billing PSP lookup are sync; reservation saga messages are async.</text><text x="40" y="970" fill="#dce8f4" font-size="15" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Supporting cache/telemetry/backup paths are defined in Network and Observability diagrams; infrastructure is not counted as business services.</text></svg>
